<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Projeto - Painel de Produtos</title>
  </head>
  <body>
    <!--
      Este é o único arquivo HTML da aplicação.
      O React vai "injetar" toda a interface dentro da div abaixo (id="root").
      É por isso que chamamos esse tipo de projeto de "SPA" (Single Page Application):
      uma única página HTML, e o JavaScript troca o conteúdo dinamicamente.
    -->
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
